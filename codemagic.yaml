workflows:
  android-release:
    name: Pipisgram Android Build
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate App Icons
        script: dart run flutter_launcher_icons
      - name: Build APK
        script: flutter build apk --release --split-per-abi --tree-shake-icons --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
